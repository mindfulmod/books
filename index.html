<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A visual, source-grounded interactive reading edition of Imam al-Ghazali's Revival of the Religious Sciences."
    />
    <meta name="theme-color" content="#e8e4da" />
    <script id="reading-theme-bootstrap">
      (() => {
        let saved;
        try { saved = localStorage.getItem('reading-theme'); } catch { /* Device preference remains available. */ }
        const theme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.readingTheme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#181d1e' : '#e8e4da';
      })();
    </script>
    <meta property="og:title" content="The Revival | Interactive reading" />
    <meta
      property="og:description"
      content="Explore the forty books as a visual journey, then read each section through concise text, interactive models, and a visible source trail."
    />
    <meta property="og:type" content="website" />
    <title>The Revival | Interactive reading</title>
  <link rel="stylesheet" href="/assets/reading-fonts/fonts.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
